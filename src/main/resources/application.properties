# ===============================
# Application
# ===============================
spring.application.name=rate-limiter

# ===============================
# Redis Configuration
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8080}

# ==========================
# Rate Limiter Configuration
# ==========================
rate-limiter.max-requests=${RATE_LIMIT_MAX_REQUESTS:5}
rate-limiter.window=${RATE_LIMIT_WINDOW:1m}

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# ===============================
# ===============================
# Application Info
# ===============================
management.info.env.enabled=true

info.app.name=Distributed API Rate Limiter
info.app.description=Redis-backed API rate limiting microservice
info.app.version=1.0.0